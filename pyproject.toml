[project]
name = "momentum-lab"
version = "0.1.0"
description = "2D top-down time-trial racer + future RL environment (Ghostline)"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
rl = ["gymnasium>=1.0"]
train = ["gymnasium>=1.0", "stable-baselines3>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["momentum_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
